name: Calibre deploy

on:
  push:
    branches:
      - main
  deployment_status:

jobs:
  deploy:
    name: Record deploy in Calibre
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create deploy
        env:
          CALIBRE_API_TOKEN: ${{ secrets.CALIBRE_API_TOKEN }}
        run: >
          npx --yes calibre deploy create
          --site=perf-email
          --revision="${{ github.sha }}"
          --repository="${{ github.server_url }}/${{ github.repository }}"
          --username="${{ github.actor }}"

  snapshot:
    name: Run snapshot in Calibre
    if: >
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, ' PR #')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create snapshot
        env:
          CALIBRE_API_TOKEN: ${{ secrets.CALIBRE_API_TOKEN }}
        run: >
          npx --yes calibre site create-snapshot
          --site=perf-email
          --ref="${{ github.event.deployment.sha }}"
